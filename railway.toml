# Financial Hub API — Railway config (monorepo root = Docker build context)
# Dashboard: leave Root Directory empty so packages/shared is available.
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "packages/shared/**",
  "pnpm-lock.yaml",
  "package.json",
  "pnpm-workspace.yaml",
]

[deploy]
healthcheckPath = "/api/health"
# Nest boots + DB ping typically finish well under a minute; 300s only
# delayed failure detection. Align with a sane ready-probe window (L10).
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Force Railway rebuild
